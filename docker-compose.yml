version: '3'
services:
  prometheus:
    image: quay.io/prometheus/prometheus:v2.33.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - /etc/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml  # Corrected volume mapping
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - monitoring_net  # Add this line

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.3.1  # Specify the desired version here
    container_name: node-exporter
    ports:
      - "9100:9100"
    networks:
      - monitoring_net  # Add this line

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring_net  # Add this line    

  postgres:
    image: postgres
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=mydatabase
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - monitoring_net  # Add this line

  timescaledb-setup:
    image: timescale/timescaledb:latest-pg14
    container_name: timescaledb-setup
    depends_on:
      - postgres
    environment:
      - POSTGRES_DB=mydatabase
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
    volumes:
      - ./sql-scripts:/docker-entrypoint-initdb.d
    networks:
      - monitoring_net
    python-runner:
      image: python:3
      container_name: python-runner
      volumes:
        - ./prometheus_metric_2.py:/app/prometheus_metric_2.py
        - ./rules_folder:/app/rules_folder
        - ./utils.py:/app/utils.py  
      command: ["sh", "-c", "pip install requests pyyaml psycopg2-binary && sleep 3 && python3 -u /app/prometheus_metric_2.py /app/rules_folder"]
      depends_on:
        - prometheus

      networks:
        - monitoring_net

networks:
  monitoring_net:
    driver : bridge  


volumes:
  #prometheus-data:
  postgres-data:
  grafana-data:
  
