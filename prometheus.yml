global:
  scrape_interval: 15s

rule_files:
  - 'custom_rules.yml'
scrape_configs:
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']  # Use the service name defined in your docker-compose.yml
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  
 